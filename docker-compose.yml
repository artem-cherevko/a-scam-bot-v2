services:
  app:
    image: ghcr.io/artem-cherevko/a-scam-bot-v2:latest
    container_name: a-scam-bot
    restart: unless-stopped

    volumes:
      - ./.env:/app/.env:ro

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    networks:
      - ascam

  postgres:
    image: postgres:18-alpine
    container_name: a-scam-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ascam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ascam
      TZ: Europe/Moscow

    volumes:
      - postgres_data:/var/lib/postgresql

    ports:
      - "5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ascam -d ascam
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - ascam

volumes:
  postgres_data:

networks:
  ascam:
    driver: bridge
